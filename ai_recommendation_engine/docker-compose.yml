services:
  postgres:
    image: postgres:16
    container_name: recsys_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recsys
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: recsys_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: recsys_app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

volumes:
  pg_data:
